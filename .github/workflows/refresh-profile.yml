name: Refresh profile cards

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

# One run at a time, so two runs never race to push.
concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install fonttools (pyftsubset) and Pillow
        run: pip install -r scripts/requirements.txt

      # Refreshes data/github.json and assets/avatar.*.
      # PROFILE_TOKEN is optional: a classic PAT with `read:user` lets the calendar include
      # private contributions. Without it the built-in token counts public ones only.
      - name: Refresh contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_data.py

      - name: Render cards
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/render_cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets cards README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi
